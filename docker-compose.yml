services:
  frontend:
    build: ./frontend/esiedt-app
    container_name: esiedt_frontend
    restart: unless-stopped
    ports:
      - "3000:80" # Nginx expose sur le port 80 en interne, relié au 3000 de votre VPS
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: esiedt_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env